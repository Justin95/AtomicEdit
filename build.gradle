processResources {
    def replace = { replaceMap ->
        return { line ->
            def newLine = line
            replaceMap.each { matchRegex, replaceStr ->
                if (line =~ matchRegex) {
                    newLine =  replaceStr
                }
            }
            return newLine
        }
    }
    filesMatching('version.txt', { file ->
        file.filter(replace([
            "atomicedit_version" : atomicEditVersion
        ]))
    })
}
